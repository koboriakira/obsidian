<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Output Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
    header { background: #1a1a2e; color: #fff; padding: 1rem; }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    .container { max-width: 960px; margin: 0 auto; padding: 1rem; }
    .file-list { list-style: none; }
    .file-item { background: #fff; border-radius: 8px; margin-bottom: 0.5rem; overflow: hidden; }
    .file-link { display: flex; align-items: center; padding: 0.875rem 1rem; text-decoration: none; color: inherit; gap: 0.75rem; }
    .file-link:active { background: #f0f0f0; }
    .file-icon { font-size: 1.5rem; flex-shrink: 0; width: 2rem; text-align: center; }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-weight: 500; word-break: break-all; }
    .file-meta { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
    .badge { display: inline-block; background: #e8e8e8; border-radius: 4px; padding: 0.125rem 0.5rem; font-size: 0.75rem; margin-right: 0.25rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: #999; }
  </style>
</head>
<body>
  <header>
    <h1>Output Explorer</h1>
  </header>
  <div class="container">
    <ul class="file-list" id="file-list"></ul>
  </div>
  <script>
    const ICONS = { markdown: "📝", pdf: "📄", html: "🌐", other: "📎" };

    async function load() {
      const res = await fetch("/api/files");
      const files = await res.json();
      const list = document.getElementById("file-list");
      if (files.length === 0) {
        list.innerHTML = '<li class="empty">ファイルがありません</li>';
        return;
      }
      list.innerHTML = files.map(f => {
        const icon = ICONS[f.file_type] || ICONS.other;
        const meta = f.metadata;
        let badges = "";
        if (meta.destination) badges += `<span class="badge">${meta.destination}</span>`;
        if (meta.audience) badges += `<span class="badge">${meta.audience}</span>`;
        if (meta.purpose) badges += `<span class="badge">${meta.purpose}</span>`;
        return `
          <li class="file-item">
            <a class="file-link" href="/view/${encodeURIComponent(f.name)}">
              <span class="file-icon">${icon}</span>
              <div class="file-info">
                <div class="file-name">${f.name}</div>
                <div class="file-meta">${badges || f.file_type}</div>
              </div>
            </a>
          </li>`;
      }).join("");
    }
    load();
  </script>
</body>
</html>
